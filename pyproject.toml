[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-city-reconstruction"
version = "0.1.0"
description = "Portable reconstruction of the Motor City Online client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyglet==2.1.19", "Pillow==12.3.0"]
license = "MIT"

[project.optional-dependencies]
catalogue = ["access-parser==0.0.6"]
oracle = ["unicorn==2.1.4"]

[project.urls]
Repository = "https://github.com/Dadud/motor-city-reconstruction"
Issues = "https://github.com/Dadud/motor-city-reconstruction/issues"

[project.scripts]
motor-city = "client.app:main"

[tool.setuptools]
packages = ["client", "tools"]
