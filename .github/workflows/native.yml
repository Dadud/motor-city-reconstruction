name: Native runtime checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release --parallel
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: runner.os == 'Linux'
        run: python -m tools.native_lobby_channel_wait_compare build/native/mco_lobby_channel_wait_compare
      - if: runner.os == 'Windows'
        run: python -m tools.native_lobby_channel_wait_compare build/native/Release/mco_lobby_channel_wait_compare.exe
      - if: runner.os == 'Linux'
        run: python -m tools.native_lobby_channel_record_compare build/native/mco_lobby_channel_record_compare
      - if: runner.os == 'Windows'
        run: python -m tools.native_lobby_channel_record_compare build/native/Release/mco_lobby_channel_record_compare.exe
      - if: runner.os == 'Linux'
        run: python -m tools.native_nps_framing_compare build/native/mco_nps_framing_compare
      - if: runner.os == 'Windows'
        run: python -m tools.native_nps_framing_compare build/native/Release/mco_nps_framing_compare.exe
      - if: runner.os == 'Linux'
        run: python -m tools.native_lobby_channel_compare build/native/mco_lobby_channel_compare
      - if: runner.os == 'Windows'
        run: python -m tools.native_lobby_channel_compare build/native/Release/mco_lobby_channel_compare.exe
      - if: runner.os == 'Linux'
        env:
          MCO_SCRIPT_RUNNER: build/native/mco_mod_script
        run: python -m unittest discover -s tests -p test_mod_script.py -v
      - if: runner.os == 'Windows'
        env:
          MCO_SCRIPT_RUNNER: build/native/Release/mco_mod_script.exe
        run: python -m unittest discover -s tests -p test_mod_script.py -v
      - if: runner.os == 'Linux'
        run: python -m tools.native_valuation_compare build/native/mco_valuation_compare
      - if: runner.os == 'Windows'
        run: python -m tools.native_valuation_compare build/native/Release/mco_valuation_compare.exe
      - if: runner.os == 'Linux'
        run: python -m tools.native_owned_parent_links_compare build/native/mco_owned_parent_links_compare
      - if: runner.os == 'Windows'
        run: python -m tools.native_owned_parent_links_compare build/native/Release/mco_owned_parent_links_compare.exe
      - if: runner.os == 'Linux'
        run: python -m tools.native_part_type_cache_compare build/native/mco_part_type_cache_compare
      - if: runner.os == 'Windows'
        run: python -m tools.native_part_type_cache_compare build/native/Release/mco_part_type_cache_compare.exe
      - if: runner.os == 'Linux'
        run: python -m tools.native_owned_induction_compare build/native/mco_owned_induction_compare
      - if: runner.os == 'Windows'
        run: python -m tools.native_owned_induction_compare build/native/Release/mco_owned_induction_compare.exe
      - if: runner.os == 'Linux'
        run: python -m tools.native_owned_insertion_compare build/native/mco_owned_insertion_compare
      - if: runner.os == 'Windows'
        run: python -m tools.native_owned_insertion_compare build/native/Release/mco_owned_insertion_compare.exe
      - if: runner.os == 'Linux'
        run: python -m tools.native_owned_aggregates_compare build/native/mco_owned_aggregates_compare
      - if: runner.os == 'Windows'
        run: python -m tools.native_owned_aggregates_compare build/native/Release/mco_owned_aggregates_compare.exe
      - if: runner.os == 'Linux'
        run: python -m tools.native_owned_ordering_compare build/native/mco_owned_ordering_compare
      - if: runner.os == 'Windows'
        run: python -m tools.native_owned_ordering_compare build/native/Release/mco_owned_ordering_compare.exe
      - if: runner.os == 'Linux'
        run: python -m tools.native_owned_postload_compare build/native/mco_owned_postload_compare
      - if: runner.os == 'Windows'
        run: python -m tools.native_owned_postload_compare build/native/Release/mco_owned_postload_compare.exe
      - if: runner.os == 'Linux'
        run: python -m tools.native_owned_descriptions_compare build/native/mco_owned_descriptions_compare
      - if: runner.os == 'Windows'
        run: python -m tools.native_owned_descriptions_compare build/native/Release/mco_owned_descriptions_compare.exe
  linux-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libasound2-dev libudev-dev
      - run: cmake -S . -B build/platform -DCMAKE_BUILD_TYPE=Release -DMCO_BUILD_PLATFORM=ON -DMCO_BUILD_SCRIPTING=OFF
      - run: cmake --build build/platform --parallel 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m tools.native_garage_fixture build/garage-fixture
      - run: xvfb-run -a build/platform/mco_native_garage --data build/garage-fixture --model data/models/synthetic.viv --smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_AUDIO_DRIVER: dummy
      - run: xvfb-run -a build/platform/mco_platform_probe --smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_AUDIO_DRIVER: dummy
