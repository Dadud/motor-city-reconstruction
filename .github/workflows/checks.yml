name: Client checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[catalogue,network]"
      - run: python -m unittest discover -s tests -v
      - run: python -m tools.auth_https_smoke
      - run: motor-city --help
      - run: python -m pip wheel . --no-deps --wheel-dir dist
  linux-graphics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - run: python -m pip install -e .
      - run: xvfb-run -a python -m tools.graphics_smoke --output evidence/linux-graphics.png
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-graphics-smoke
          path: evidence/linux-graphics.*
